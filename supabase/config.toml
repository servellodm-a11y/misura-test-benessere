# NEXTWAY staging preparation.
# Local CLI project label only: this is NOT a Supabase hosted project ref.
# No remote is linked here. Do not run supabase start on the 8 GB Intel Mac.

project_id = "nextway-staging-prepared"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[studio]
enabled = false
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "12MiB"

[auth]
enabled = true
site_url = "http://localhost:8000"
additional_redirect_urls = [
  "http://localhost:8000/nextway-ai.html",
  "http://localhost:8000/nextway-reset-password.html"
]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
