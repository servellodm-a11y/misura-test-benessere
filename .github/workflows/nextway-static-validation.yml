name: NEXTWAY static validation

on:
  push:
    branches: [main]
    paths:
      - "nextway-cloud.js"
      - "nextway-setter.js"
      - "supabase/functions/nextway-ai-setter/**"
      - "nextway-ai.html"
      - "supabase/migrations/**"
      - "scripts/validate-nextway-audit.mjs"
      - ".github/workflows/nextway-static-validation.yml"
  pull_request:
    paths:
      - "nextway-cloud.js"
      - "nextway-setter.js"
      - "nextway-ai.html"
      - "supabase/functions/nextway-ai-setter/**"
      - "supabase/migrations/**"
      - "scripts/validate-nextway-audit.mjs"
      - ".github/workflows/nextway-static-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate NEXTWAY audit
        run: node scripts/validate-nextway-audit.mjs
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check AI Setter Edge Function
        run: deno check supabase/functions/nextway-ai-setter/index.ts
