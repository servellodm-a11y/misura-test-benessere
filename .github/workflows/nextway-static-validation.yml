name: NEXTWAY static validation

on:
  push:
    branches: [main, fix/nextway-password-recovery]
    paths:
      - "nextway-cloud.js"
      - "nextway-setter.js"
      - "supabase/functions/nextway-ai-setter/**"
      - "supabase/functions/nextway-knowledge-ingest/**"
      - "supabase/functions/nextway-knowledge-upload/**"
      - "supabase/functions/nextway-conversion-provisioning/**"
      - "scripts/test-nextway-partner-cancellation-spec.mjs"
      - "scripts/test-nextway-partner-invite-lifecycle.mjs"
      - "supabase/functions/nextway-conversion-provisioning/invite-lifecycle.mjs"
      - "supabase/functions/nextway-workspace-admin/**"
      - "supabase/functions/nextway-search/**"
      - "nextway-ai.html"
      - "nextway-admin.html"
      - "nextway-admin.js"
      - "supabase/migrations/**"
      - "scripts/test-nextway-knowledge-upload-security.mjs"
      - "scripts/validate-nextway-audit.mjs"
      - "scripts/test-nextway-provisioning-security.mjs"
      - "scripts/test-nextway-edge-functions-security.mjs"
      - "scripts/test-nextway-idempotency-sql-security.mjs"
      - "scripts/test-nextway-knowledge-base-sql.mjs"
      - "scripts/test-nextway-knowledge-ingest-security.mjs"
      - "scripts/test-nextway-multi-workspace-sql.mjs"
      - "scripts/test-nextway-workspace-admin-security.mjs"
      - "scripts/test-nextway-workspace-data-association.mjs"
      - "scripts/test-nextway-workspace-memberships.mjs"
      - "scripts/test-nextway-workspace-scoped-rls.mjs"
      - "scripts/test-nextway-setter-generation-workspace.mjs"
      - "scripts/test-nextway-setter-generation-table-isolation.mjs"
      - "scripts/test-nextway-lead-creation-workspace.mjs"
      - "scripts/test-nextway-conversion-workspace-preflight.mjs"
      - "scripts/test-nextway-conversion-workspace-snapshot.mjs"
      - "supabase/diagnostics/nextway_conversion_workspace_preflight_readonly.sql"
      - "scripts/test-nextway-conversion-workspace-preflight.mjs"
      - "supabase/diagnostics/nextway_conversion_workspace_preflight_readonly.sql"
      - "scripts/test-nextway-setter-workspace-ui.mjs"
      - "scripts/test-nextway-setter-governance.mjs"
      - "scripts/test-nextway-admin-ui.mjs"
      - "scripts/test-nextway-local-cors.mjs"
      - "scripts/test-nextway-local-static.py"
      - "scripts/nextway-local-preflight.sh"
      - "scripts/check-nextway-schema-dump.py"
      - ".github/workflows/nextway-static-validation.yml"
  pull_request:
    paths:
      - "nextway-cloud.js"
      - "nextway-setter.js"
      - "nextway-ai.html"
      - "nextway-admin.html"
      - "nextway-admin.js"
      - "supabase/functions/nextway-ai-setter/**"
      - "supabase/functions/nextway-knowledge-ingest/**"
      - "supabase/functions/nextway-knowledge-upload/**"
      - "supabase/functions/nextway-conversion-provisioning/**"
      - "scripts/test-nextway-partner-invite-lifecycle.mjs"
      - "scripts/test-nextway-partner-cancellation-spec.mjs"
      - "scripts/test-nextway-conversion-workspace-preflight.mjs"
      - "supabase/diagnostics/nextway_conversion_workspace_preflight_readonly.sql"
      - "supabase/functions/nextway-conversion-provisioning/invite-lifecycle.mjs"
      - "supabase/functions/nextway-workspace-admin/**"
      - "supabase/functions/nextway-search/**"
      - "supabase/migrations/**"
      - "scripts/test-nextway-knowledge-upload-security.mjs"
      - "scripts/validate-nextway-audit.mjs"
      - "scripts/test-nextway-provisioning-security.mjs"
      - "scripts/test-nextway-edge-functions-security.mjs"
      - "scripts/test-nextway-idempotency-sql-security.mjs"
      - "scripts/test-nextway-knowledge-base-sql.mjs"
      - "scripts/test-nextway-knowledge-ingest-security.mjs"
      - "scripts/test-nextway-multi-workspace-sql.mjs"
      - "scripts/test-nextway-workspace-admin-security.mjs"
      - "scripts/test-nextway-workspace-data-association.mjs"
      - "scripts/test-nextway-workspace-memberships.mjs"
      - "scripts/test-nextway-workspace-scoped-rls.mjs"
      - "scripts/test-nextway-setter-generation-workspace.mjs"
      - "scripts/test-nextway-lead-creation-workspace.mjs"
      - "scripts/test-nextway-conversion-workspace-snapshot.mjs"
      - "scripts/test-nextway-setter-workspace-ui.mjs"
      - "scripts/test-nextway-setter-governance.mjs"
      - "scripts/test-nextway-setter-generation-table-isolation.mjs"
      - "scripts/test-nextway-admin-ui.mjs"
      - "scripts/test-nextway-local-cors.mjs"
      - ".github/workflows/nextway-static-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate NEXTWAY audit
        run: node scripts/validate-nextway-audit.mjs
      - name: Validate conversion provisioning security contract
        run: node scripts/test-nextway-provisioning-security.mjs
      - name: Validate Edge Functions security contracts
        run: node scripts/test-nextway-edge-functions-security.mjs
      - name: Validate rate limit and idempotency SQL security contracts
        run: node scripts/test-nextway-idempotency-sql-security.mjs
      - name: Validate NEXTWAY Knowledge Base SQL contract
        run: node scripts/test-nextway-knowledge-base-sql.mjs
      - name: Validate NEXTWAY Knowledge Ingest security contract
        run: node scripts/test-nextway-knowledge-ingest-security.mjs
      - name: Validate NEXTWAY Knowledge Upload security contract
        run: node scripts/test-nextway-knowledge-upload-security.mjs
      - name: Validate NEXTWAY multi-workspace SQL contract
        run: node scripts/test-nextway-multi-workspace-sql.mjs
      - name: Validate NEXTWAY workspace admin security contract
        run: node scripts/test-nextway-workspace-admin-security.mjs
      - name: Validate NEXTWAY local CORS allow-lists
        run: node scripts/test-nextway-local-cors.mjs
      - name: Validate NEXTWAY local preflight shell syntax
        run: bash -n scripts/nextway-local-preflight.sh
      - name: Test NEXTWAY schema dump SQL scanner
        run: python3 scripts/check-nextway-schema-dump.py --self-test
      - name: Validate NEXTWAY workspace data association contract
        run: node scripts/test-nextway-workspace-data-association.mjs
      - name: Validate NEXTWAY workspace membership contract
        run: node scripts/test-nextway-workspace-memberships.mjs
      - name: Validate NEXTWAY workspace-scoped RLS contract
        run: node scripts/test-nextway-workspace-scoped-rls.mjs
      - name: Validate NEXTWAY AI Setter generation workspace contract
        run: node scripts/test-nextway-setter-generation-workspace.mjs
      - name: Validate AI Setter legacy/workspace table isolation
        run: node scripts/test-nextway-setter-generation-table-isolation.mjs
      - name: Validate NEXTWAY workspace-aware Lead creation contract
        run: node scripts/test-nextway-lead-creation-workspace.mjs
      - name: Validate conversion workspace preflight is read-only
        run: node scripts/test-nextway-conversion-workspace-preflight.mjs
      - name: Validate conversion workspace snapshot and transactional fixture contract
        run: node scripts/test-nextway-conversion-workspace-snapshot.mjs
      - name: Test Partner invitation lifecycle decisions
        run: node scripts/test-nextway-partner-invite-lifecycle.mjs
      - name: Validate Partner cancellation lifecycle specification
        run: node scripts/test-nextway-partner-cancellation-spec.mjs
      - name: Validate NEXTWAY AI Setter workspace selector contract
        run: node scripts/test-nextway-setter-workspace-ui.mjs
      - name: Validate NEXTWAY AI Setter governance integration
        run: node scripts/test-nextway-setter-governance.mjs
      - name: Validate NEXTWAY platform admin UI contract
        run: node scripts/test-nextway-admin-ui.mjs
      - name: Validate NEXTWAY local static checks with Python 3
        run: python3 scripts/test-nextway-local-static.py
      - name: Syntax-check NEXTWAY platform admin browser script
        run: node --check nextway-admin.js
      - name: Syntax-check NEXTWAY AI Setter browser script
        run: node --check nextway-setter.js
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check AI Setter Edge Function
        run: deno check supabase/functions/nextway-ai-setter/index.ts
      - name: Type-check Knowledge Ingest Edge Function
        run: deno check supabase/functions/nextway-knowledge-ingest/index.ts
      - name: Type-check Knowledge Upload Edge Function
        run: deno check supabase/functions/nextway-knowledge-upload/index.ts
      - name: Type-check conversion provisioning Edge Function
        run: deno check supabase/functions/nextway-conversion-provisioning/index.ts
      - name: Type-check workspace admin Edge Function
        run: deno check supabase/functions/nextway-workspace-admin/index.ts
      - name: Type-check public search Edge Function
        run: deno check supabase/functions/nextway-search/index.ts
